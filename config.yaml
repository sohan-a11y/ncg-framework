# NCG Framework Default Configuration
# Copy to config.local.yaml and modify for local overrides

model:
  vocab_size: 99
  max_seq_len: 64
  d_model: 256
  n_heads: 8
  n_layers: 6
  d_ff: 1024
  dropout: 0.1
  quantization: "int4"
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2
  unk_token_id: 3

training:
  batch_size: 32
  learning_rate: 3.0e-4
  weight_decay: 0.01
  max_epochs: 100
  warmup_steps: 1000
  gradient_clip: 1.0
  mixed_precision: true
  quantization_aware: true
  distillation: false
  teacher_model_path: null

inference:
  top_k: 50
  top_p: 0.9
  temperature: 1.0
  num_beams: 4
  max_new_tokens: 64
  do_sample: true

hardware:
  target_device: "alveo_u50"
  clock_mhz: 200
  hash_engines: 1024
  logic_allocation_hash: 0.6
  logic_allocation_ai: 0.3
  logic_allocation_ctrl: 0.1
  pcie_gen: 5
  pcie_lanes: 16
  hbm_channels: 2

logging:
  level: "INFO"
  format: "rich"
  output: "rich"
  file_path: "logs/ncg.log"
  max_bytes: 10485760
  backup_count: 5